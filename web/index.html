<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>my-tty</title>
    <!-- 字体是 font-display: block，提前发起请求缩短首屏空白；href 必须与 style.css 里的一致。 -->
    <link rel="preload" href="/vendor/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <span class="brand">my-tty</span>
        <span id="status"></span>
        <span class="spacer"></span>
        <span id="hint">Ctrl+C 复制选中 / 中断 · Ctrl+V 粘贴 · Ctrl+Shift+F 查找</span>
        <button id="send-interrupt" class="icon" type="button" title="发送 Ctrl+C（中断，适用于 RDP 等 Ctrl 不可用的环境）">^C</button>
        <button id="font-dec" class="icon" type="button" title="缩小字号">A−</button>
        <button id="font-inc" class="icon" type="button" title="放大字号">A+</button>
        <button id="toggle-files" type="button" title="文件" aria-label="文件"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h6l3 3v8h-9z"/><path d="M9.5 2.5v3h3"/><path d="M5.5 8.5h5M5.5 11h5"/></svg></button>
        <button id="add-pane" type="button" title="新建分屏" aria-label="新建分屏"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M8 3.5v9"/></svg></button>
        <button id="logout" type="button" title="注销" aria-label="注销"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3.5h-3v9h3"/><path d="M9 5.5 11.5 8 9 10.5"/><path d="M5.5 8h6"/></svg></button>
      </header>

      <div id="main">
        <div id="tabbar">
          <div id="tab-strip">
            <button id="tab-more" type="button" title="隐藏的标签页" aria-label="隐藏的标签页" hidden><svg class="ico dots" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/></svg></button>
            <div id="tab-list" role="tablist" aria-label="终端标签页"></div>
            <button id="tab-add" type="button" title="新建标签页" aria-label="新建标签页"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
          </div>
          <div id="tab-menu" hidden></div>
        </div>

        <div id="find-bar" hidden>
          <input id="find-input" type="text" placeholder="在当前终端中查找…" autocomplete="off" spellcheck="false" />
          <span id="find-count"></span>
          <button id="find-prev" class="icon" type="button" title="上一个 (Shift+F3)" aria-label="上一个"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5v-9"/><path d="M4.5 7 8 3.5 11.5 7"/></svg></button>
          <button id="find-next" class="icon" type="button" title="下一个 (F3)" aria-label="下一个"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9"/><path d="M4.5 9 8 12.5 11.5 9"/></svg></button>
          <button id="find-close" class="icon" type="button" title="关闭 (Esc)" aria-label="关闭查找"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></svg></button>
        </div>

        <div id="body">
          <aside id="files" hidden>
            <div class="files-head">
              <div id="crumb"></div>
              <span class="spacer"></span>
              <button id="files-refresh" class="icon" type="button" title="刷新" aria-label="刷新"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.55-3.63"/><path d="M13 2.5V6h-3.5"/></svg></button>
              <button id="files-cwd-sync" class="icon" type="button" title="目录跟随：开（点击关闭）" aria-label="目录跟随" aria-pressed="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2.2M8 12.3v2.2M1.5 8h2.2M12.3 8h2.2"/></svg></button>
              <button id="files-upload" class="icon" type="button" title="上传文件（也可直接拖入）" aria-label="上传文件"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5v-8"/><path d="M4.5 6 8 2.5 11.5 6"/><path d="M3 10.5v3h10v-3"/></svg></button>
              <button id="files-new-file" class="icon" type="button" title="新建文件" aria-label="新建文件"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2h6l3 3v9h-9z"/><path d="M9.5 2v3h3"/><path d="M8 8v4M6 10h4"/></svg></button>
              <button id="files-new-dir" class="icon" type="button" title="新建目录" aria-label="新建目录"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5h4.5l1.3 1.8h7.2v7.2h-13z"/><path d="M8 7.5v4M6 9.5h4"/></svg></button>
            </div>
            <ul id="file-list"></ul>
            <p id="notice"></p>
            <div id="upload-progress" hidden>
              <div class="bar"><span id="uprog-fill"></span></div>
              <span id="uprog-text"></span>
              <button id="uprog-cancel" class="icon" type="button" title="取消上传" aria-label="取消上传"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></svg></button>
            </div>
            <input id="upload-input" type="file" multiple hidden />
          </aside>

          <div id="files-resize" title="拖动调整文件面板宽度" hidden></div>

          <main id="workspace" data-count="0"></main>
        </div>

        <div id="keys" aria-label="移动端快捷键">
          <button type="button" data-key="esc">Esc</button>
          <button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="ctrl">Ctrl</button>
          <button type="button" data-key="up">↑</button>
          <button type="button" data-key="down">↓</button>
          <button type="button" data-key="left">←</button>
          <button type="button" data-key="right">→</button>
          <button type="button" data-key="ctrlc">^C</button>
          <button type="button" data-key="ctrld">^D</button>
          <button type="button" data-key="ctrll">^L</button>
        </div>
      </div>
    </div>

    <div id="prompt-overlay" hidden>
      <form id="prompt-form" class="prompt-card">
        <h1 id="prompt-title">新建</h1>
        <p id="prompt-message" hidden></p>
        <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
        <p id="prompt-error"></p>
        <div class="prompt-actions">
          <button id="prompt-cancel" type="button">取消</button>
          <button id="prompt-ok" type="submit">确定</button>
        </div>
      </form>
    </div>

    <div id="login-overlay" hidden>
      <form id="login-form" class="login-card">
        <h1>登录 my-tty</h1>
        <p class="sub">所有终端与文件功能都需要登录后使用</p>
        <input
          id="login-password"
          type="password"
          autocomplete="current-password"
          placeholder="访问密码"
          required
        />
        <p id="login-error"></p>
        <button id="login-submit" type="submit">登录</button>
        <p class="ttl">登录状态默认保持 7 天</p>
      </form>
    </div>

    <div id="editor-overlay" hidden>
      <section class="editor" role="dialog" aria-modal="true">
        <header>
          <span id="editor-path"></span>
          <span id="editor-state"></span>
          <span class="spacer"></span>
          <button id="editor-save" class="icon" type="button" title="保存 (Ctrl+S)" aria-label="保存"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7l3 3v8H3z"/><path d="M5.5 2.5v3.5h5V2.5"/><path d="M5 9.5h6"/></svg></button>
          <button id="editor-close" class="icon" type="button" title="关闭 (Esc)" aria-label="关闭"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></svg></button>
        </header>
        <div class="editor-body">
          <pre id="editor-gutter" aria-hidden="true"></pre>
          <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <footer>Ctrl+S 保存 · Esc 关闭</footer>
      </section>
    </div>

    <script src="/vendor/xterm/xterm.js"></script>
    <script src="/vendor/xterm/addon-fit.js"></script>
    <script src="/vendor/xterm/addon-search.js"></script>
    <script src="/vendor/xterm/addon-web-links.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
