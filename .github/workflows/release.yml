name: release

# 打 vX.Y.Z tag 时自动构建并发布；也可在 Actions 里对已有 tag 手动触发。
# 发布前必须先跑完整测试，避免 tag 和 main/CI 的结果不一致。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag（例如 v0.1.2）"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: unit + smoke
        run: |
          zig test src/tests.zig
          ./scripts/smoke.sh
      - name: browser deps
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: browser
        run: ./scripts/browser_test.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - name: build
        run: ./scripts/build-release.sh ${{ matrix.target }}
      - name: version check
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          zon_version=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)
          [ "$zon_version" = "$version" ]
          [ "$(./zig-out/bin/my-tty --version 2>&1)" = "my-tty $version" ]
      - name: runtime check
        run: ./zig-out/bin/my-tty --check-config
      - name: package
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pkg="my-tty-${version}-${{ matrix.arch }}"
          mkdir -p "dist/$pkg/deploy" "dist/$pkg/licenses"
          cp zig-out/bin/my-tty "dist/$pkg/"
          cp README.md README.en.md my-tty.example.json LICENSE THIRD_PARTY_NOTICES.md "dist/$pkg/"
          cp deploy/my-tty.service "dist/$pkg/deploy/"
          cp web/vendor/xterm/LICENSE "dist/$pkg/licenses/xterm.txt"
          cp web/vendor/xterm/LICENSE.addon-fit "dist/$pkg/licenses/xterm-addon-fit.txt"
          cp web/vendor/xterm/LICENSE.addon-search "dist/$pkg/licenses/xterm-addon-search.txt"
          cp web/vendor/xterm/LICENSE.addon-web-links "dist/$pkg/licenses/xterm-addon-web-links.txt"
          cp web/vendor/fonts/OFL.txt "dist/$pkg/licenses/JetBrainsMono-OFL.txt"
          cp licenses/zig.txt "dist/$pkg/licenses/zig.txt"
          # 固定 mtime/owner/排序，让同一 tag 重建得到同样的 tar.gz。
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - "$pkg" | gzip -n > "dist/$pkg-linux.tar.gz"
          ( cd dist && sha256sum "$pkg-linux.tar.gz" > "$pkg-linux.tar.gz.sha256" )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: check tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must look like v0.1.2, got '$RELEASE_TAG'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c --strict ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          title="my-tty $RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file ../.github/release-notes.md
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
              --verify-tag --title "$title" --notes-file ../.github/release-notes.md
          fi
