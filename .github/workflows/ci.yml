name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: format
        run: zig fmt --check build.zig src/*.zig web/embed.zig
      - name: script syntax
        run: |
          cat web/js/*.js | node --check
          for f in tests/browser/*.cjs scripts/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: build
        run: zig build
      - name: test
        run: zig test src/tests.zig
      - name: smoke
        run: ./scripts/smoke.sh
      - name: release build
        run: ./scripts/build-release.sh
      - name: cross compile
        run: zig build -Dtarget=aarch64-linux -Doptimize=safe

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: cache playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: install browser deps
        working-directory: tests/browser
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: browser tests
        run: ./scripts/browser_test.sh
